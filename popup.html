<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Escritor Baiano</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  width:320px;
  min-height:190px;
  background:#07142d;
  color:white;
  overflow:hidden;
}

.wrap{
  padding:16px;
  background:linear-gradient(145deg,#07142d,#081b3d);
  border:1px solid rgba(62,154,255,.22);
}

.top{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:18px;
}

.avatar{
  width:68px;
  height:68px;
  border-radius:18px;
  border:2px solid #33a3ff;
  object-fit:cover;
  box-shadow:0 0 20px rgba(51,163,255,.35);
}

.title{
  flex:1;
  text-align:left;
}

.title h1{
  font-size:19px;
  line-height:22px;
  color:#32a4ff;
}

.title b{
  color:white;
}

.desc{
  color:#b9c8df;
  font-size:12px;
  margin-top:5px;
}

.inject{
  width:100%;
  height:42px;
  border:none;
  border-radius:10px;
  background:#24c763;
  color:white;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(36,199,99,.24);
}

.inject:hover{
  filter:brightness(1.08);
}

.hint{
  text-align:center;
  font-size:11px;
  color:#8fa9ca;
  margin-top:10px;
}

.status{
  text-align:center;
  font-size:12px;
  color:#35a2ff;
  margin-top:8px;
  min-height:15px;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="top">
    <img class="avatar" src="icons/icon128.png">
    <div class="title">
      <h1>Escritor <b>Baiano</b></h1>
      <div class="desc">Auto Writer injetável</div>
    </div>
  </div>

  <button class="inject" id="inject">⚙ Injetar código</button>

  <div class="hint">
    Injete na página atual. Depois use o botão Painel que aparece na página.
  </div>

  <div class="status" id="status"></div>
</div>

<script src="popup.js"></script>
</body>
</html>
